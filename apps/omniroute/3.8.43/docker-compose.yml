networks:
  1panel-network:
    external: true

services:
  omniroute:
    image: diegosouzapw/omniroute:3.8.43
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:20128
    env_file:
      - ${GLOBAL_ENV_FILE:-/etc/1panel/envs/global.env}
      - ${ENV_FILE:-/etc/1panel/envs/default.env}
    volumes:
      - ${OMNIROUTE_ROOT_PATH}/data:/app/data
    environment:
      - TZ=Asia/Shanghai
